name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Determine release version from conventional commits
        id: version
        shell: bash
        run: |
          set -euo pipefail

          last_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$last_tag" ]]; then
            range="${last_tag}..HEAD"
            base_version="${last_tag#v}"
          else
            range="HEAD"
            base_version="$(node -p "require('./package.json').version")"
          fi

          messages="$(git log --format='%B' "$range")"
          if grep -Eq '(^[[:alpha:]]+(\([^)]*\))?!:|BREAKING CHANGE:)' <<<"$messages"; then
            release_type=major
          elif grep -Eq '^feat(\([^)]*\))?:' <<<"$messages"; then
            release_type=minor
          elif grep -Eq '^(fix|perf)(\([^)]*\))?:' <<<"$messages"; then
            release_type=patch
          else
            echo "No conventional commit requires a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<<"$base_version"
          case "$release_type" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: bun install --frozen-lockfile

      - name: Set the extension version
        if: steps.version.outputs.release == 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build release archives
        if: steps.version.outputs.release == 'true'
        run: |
          bun run zip
          bun run zip:firefox
          bun run zip:firefox-android

      - name: Commit the release version
        if: steps.version.outputs.release == 'true'
        run: |
          if git diff --quiet -- package.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" .output/tabtether-*.zip \
            --target "$(git rev-parse HEAD)" \
            --title "TabTether v${{ steps.version.outputs.version }}" \
            --generate-notes
